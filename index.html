  <script>
    document.addEventListener('DOMContentLoaded', () => {
      
      // Application State
      const state = {
        elements: [],
        selectedId: null,
        paperColor: '#ffffff',
        // 20 rich colors requested including Metallic Gold
        colors: [
          '#D4AF37', // Metallic Gold
          '#B76E79', // Rose Gold
          '#00FFFF', // Cyber Cyan
          '#39FF14', // Neon Green
          '#8A2BE2', // Deep Violet
          '#FF4500', // Sunset Orange
          '#000000', // Pure Black
          '#FFFFFF', // Crisp White
          '#4F46E5', // Indigo
          '#EC4899', // Pink
          '#10B981', // Emerald
          '#F59E0B', // Amber
          '#EF4444', // Red
          '#06B6D4', // Sky Cyan
          '#6366F1', // Lavender Blue
          '#14B8A6', // Teal
          '#8B5CF6', // Purple
          '#D97706', // Gold Yellow
          '#334155', // Slate Gray
          '#475569'  // Cool Gray
        ]
      };

      const artboard = document.getElementById('artboard');
      const canvasElements = document.getElementById('canvasElements');
      const drawerPanel = document.getElementById('drawerPanel');
      const selectionOverlay = document.getElementById('selectionOverlay');

      // Populate Color Swatches Grid
      function initColorGrid() {
        const grid = document.getElementById('colorsGrid');
        grid.innerHTML = '';
        state.colors.forEach(col => {
          const btn = document.createElement('button');
          btn.className = 'w-10 h-10 rounded-full border border-slate-700/60 shadow-md transition active:scale-95 mx-auto';
          btn.style.backgroundColor = col;
          btn.addEventListener('click', () => applyColorToSelected(col));
          grid.appendChild(btn);
        });
      }

      // Render Canvas Elements
      function renderCanvas() {
        canvasElements.innerHTML = '';

        state.elements.forEach(elem => {
          const isSelected = elem.id === state.selectedId;
          const wrapper = document.createElement('div');
          wrapper.id = elem.id;
          wrapper.className = `absolute cursor-move touch-none flex items-center justify-center ${isSelected ? 'element-selected' : ''}`;
          
          wrapper.style.left = `${elem.x}px`;
          wrapper.style.top = `${elem.y}px`;
          wrapper.style.width = `${elem.width}px`;
          wrapper.style.height = `${elem.height}px`;

          // Touch and Mouse Dragging
          const handleDrag = (e) => {
            e.stopPropagation();
            selectElement(elem.id);

            const startX = e.touches ? e.touches[0].clientX : e.clientX;
            const startY = e.touches ? e.touches[0].clientY : e.clientY;
            const origX = elem.x;
            const origY = elem.y;

            function onMove(e) {
              const curX = e.touches ? e.touches[0].clientX : e.clientX;
              const curY = e.touches ? e.touches[0].clientY : e.clientY;
              elem.x = Math.round(origX + (curX - startX));
              elem.y = Math.round(origY + (curY - startY));
              renderCanvas();
            }

            function onEnd() {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onEnd);
              document.removeEventListener('touchmove', onMove);
              document.removeEventListener('touchend', onEnd);
              renderLayersList();
            }

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove);
            document.addEventListener('touchend', onEnd);
          };

          wrapper.addEventListener('mousedown', handleDrag);
          wrapper.addEventListener('touchstart', handleDrag, { passive: true });

          // Types: Text, Shape
          if (elem.type === 'text') {
            const txt = document.createElement('div');
            txt.className = 'w-full h-full flex items-center justify-center text-center font-bold break-words leading-tight';
            txt.style.fontFamily = elem.fontFamily || 'Inter';
            txt.style.fontSize = `${elem.fontSize}px`;
            txt.style.color = elem.color || '#000000';
            txt.innerText = elem.text;
            wrapper.appendChild(txt);
          } else if (elem.type === 'shape') {
            const shp = document.createElement('div');
            shp.className = 'w-full h-full flex items-center justify-center';
            
            if (elem.shape === 'square') {
              shp.style.backgroundColor = elem.color;
              shp.style.borderRadius = '6px';
            } else if (elem.shape === 'circle') {
              shp.style.backgroundColor = elem.color;
              shp.style.borderRadius = '9999px';
            } else if (elem.shape === 'triangle') {
              shp.className = 'shape-triangle';
              shp.style.color = elem.color;
            } else if (elem.shape === 'right-triangle') {
              shp.className = 'shape-right-triangle';
              shp.style.color = elem.color;
            } else if (elem.shape === 'star') {
              shp.className = 'w-full h-full shape-star';
              shp.style.backgroundColor = elem.color;
            } else if (elem.shape === 'hexagon') {
              shp.className = 'w-full h-full shape-hexagon';
              shp.style.backgroundColor = elem.color;
            } else if (elem.shape === 'heart') {
              shp.className = 'w-full h-full shape-heart';
              shp.style.backgroundColor = elem.color;
            } else if (elem.shape === 'line') {
              shp.className = 'w-full h-2 rounded';
              shp.style.backgroundColor = elem.color;
            } else if (elem.shape === 'ring') {
              shp.className = 'w-full h-full rounded-full';
              shp.style.border = `6px solid ${elem.color}`;
            }

            wrapper.appendChild(shp);
          }

          canvasElements.appendChild(wrapper);
        });

        updateSelectionOverlay();
      }

      function selectElement(id) {
        state.selectedId = id;
        renderCanvas();
        
        // Sync text input keyboard box
        const elem = state.elements.find(e => e.id === id);
        if (elem && elem.type === 'text') {
          document.getElementById('textInput').value = elem.text;
          document.getElementById('textSizeSlider').value = elem.fontSize;
        }
      }

      function updateSelectionOverlay() {
        if (state.selectedId) {
          selectionOverlay.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
        } else {
          selectionOverlay.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
        }
      }

      function applyColorToSelected(color) {
        if (state.selectedId) {
          const elem = state.elements.find(e => e.id === state.selectedId);
          if (elem) elem.color = color;
        } else {
          // If nothing selected, set paper background color
          artboard.style.backgroundColor = color;
        }
        renderCanvas();
      }

      // Add Text
      document.getElementById('btnAddText').addEventListener('click', () => {
        const textVal = document.getElementById('textInput').value.trim() || 'Tap to Write';
        const newElem = {
          id: 'elem_' + Date.now(),
          type: 'text',
          text: textVal,
          fontSize: 28,
          fontFamily: 'Inter',
          color: '#000000',
          x: 70, y: 140,
          width: 200, height: 60
        };
        state.elements.push(newElem);
        selectElement(newElem.id);
      });

      // Keyboard text typing listener
      document.getElementById('textInput').addEventListener('input', (e) => {
        const elem = state.elements.find(e => e.id === state.selectedId);
        if (elem && elem.type === 'text') {
          elem.text = e.target.value;
          renderCanvas();
        }
      });

      // Text size buttons
      document.querySelectorAll('.btn-text-size').forEach(btn => {
        btn.addEventListener('click', () => {
          const size = parseInt(btn.getAttribute('data-size'));
          document.getElementById('textSizeSlider').value = size;
          const elem = state.elements.find(e => e.id === state.selectedId);
          if (elem && elem.type === 'text') {
            elem.fontSize = size;
            renderCanvas();
          }
        });
      });

      // Text size slider
      document.getElementById('textSizeSlider').addEventListener('input', (e) => {
        const elem = state.elements.find(e => e.id === state.selectedId);
        if (elem && elem.type === 'text') {
          elem.fontSize = parseInt(e.target.value);
          renderCanvas();
        }
      });

      // Fonts options
      document.querySelectorAll('.btn-font').forEach(btn => {
        btn.addEventListener('click', () => {
          const font = btn.getAttribute('data-font');
          const elem = state.elements.find(e => e.id === state.selectedId);
          if (elem && elem.type === 'text') {
            elem.fontFamily = font;
            renderCanvas();
          }
        });
      });

      // Add Shape
      document.querySelectorAll('.btn-add-shape').forEach(btn => {
        btn.addEventListener('click', () => {
          const shapeType = btn.getAttribute('data-shape');
          const newElem = {
            id: 'elem_' + Date.now(),
            type: 'shape',
            shape: shapeType,
            color: '#4F46E5',
            x: 120, y: 120,
            width: 100, height: 100
          };
          if (shapeType === 'line') { newElem.width = 160; newElem.height = 20; }
          state.elements.push(newElem);
          selectElement(newElem.id);
        });
      });

      // Built-in Logo Presets
      document.querySelectorAll('.btn-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          const preset = btn.getAttribute('data-preset');
          state.elements = [];
          if (preset === 'luxury') {
            state.elements.push(
              { id: '1', type: 'shape', shape: 'ring', color: '#D4AF37', x: 120, y: 70, width: 100, height: 100 },
              { id: '2', type: 'text', text: 'M', fontSize: 48, fontFamily: 'Cinzel', color: '#D4AF37', x: 120, y: 85, width: 100, height: 60 },
              { id: '3', type: 'text', text: 'MIMI CREST', fontSize: 20, fontFamily: 'Cinzel', color: '#000000', x: 70, y: 190, width: 200, height: 40 }
            );
          } else if (preset === 'cyber') {
            state.elements.push(
              { id: '1', type: 'shape', shape: 'hexagon', color: '#00FFFF', x: 120, y: 70, width: 100, height: 100 },
              { id: '2', type: 'text', text: 'CYBER', fontSize: 28, fontFamily: 'Space Grotesk', color: '#000000', x: 70, y: 190, width: 200, height: 40 }
            );
          } else if (preset === 'minimal') {
            state.elements.push(
              { id: '1', type: 'shape', shape: 'square', color: '#4F46E5', x: 130, y: 80, width: 80, height: 80 },
              { id: '2', type: 'text', text: 'STUDIO', fontSize: 24, fontFamily: 'Montserrat', color: '#000000', x: 70, y: 180, width: 200, height: 40 }
            );
          } else if (preset === 'nature') {
            state.elements.push(
              { id: '1', type: 'shape', shape: 'circle', color: '#10B981', x: 120, y: 70, width: 100, height: 100 },
              { id: '2', type: 'text', text: 'NATURAL', fontSize: 22, fontFamily: 'Fredoka', color: '#000000', x: 70, y: 190, width: 200, height: 40 }
            );
          }
          selectElement(state.elements[0].id);
        });
      });

      // Background options
      document.getElementById('btnPaperWhite').addEventListener('click', () => artboard.style.backgroundColor = '#ffffff');
      document.getElementById('btnPaperDark').addEventListener('click', () => artboard.style.backgroundColor = '#0f172a');
      document.getElementById('btnPaperCream').addEventListener('click', () => artboard.style.backgroundColor = '#FFFDD0');

      // Layers Render
      function renderLayersList() {
        const list = document.getElementById('layersList');
        list.innerHTML = '';
        state.elements.slice().reverse().forEach(elem => {
          const item = document.createElement('div');
          item.className = `p-2 rounded-lg text-xs flex justify-between bg-slate-800 text-slate-200 cursor-pointer ${elem.id === state.selectedId ? 'border border-indigo-500' : ''}`;
          item.innerText = `${elem.type.toUpperCase()}: ${elem.text || elem.shape}`;
          item.addEventListener('click', () => selectElement(elem.id));
          list.appendChild(item);
        });
      }

      // Context Quick Bar Actions
      document.getElementById('btnDelete').addEventListener('click', () => {
        if (state.selectedId) {
          state.elements = state.elements.filter(e => e.id !== state.selectedId);
          state.selectedId = null;
          renderCanvas();
        }
      });

      document.getElementById('btnDuplicate').addEventListener('click', () => {
        const elem = state.elements.find(e => e.id === state.selectedId);
        if (elem) {
          const clone = JSON.parse(JSON.stringify(elem));
          clone.id = 'elem_' + Date.now();
          clone.x += 15; clone.y += 15;
          state.elements.push(clone);
          selectElement(clone.id);
        }
      });

      // Bottom Dock Drawer Navigation Handler
      document.querySelectorAll('.nav-dock-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-target');
          
          document.querySelectorAll('.tool-panel').forEach(p => p.classList.add('hidden'));
          document.getElementById(`panel-${target}`).classList.remove('hidden');

          drawerPanel.style.maxHeight = '280px';
          renderLayersList();
        });
      });

      document.getElementById('btnCloseDrawer').addEventListener('click', () => {
        drawerPanel.style.maxHeight = '0px';
      });

      // Clear Canvas
      document.getElementById('btnClear').addEventListener('click', () => {
        state.elements = [];
        state.selectedId = null;
        renderCanvas();
      });

      // Download PNG
      document.getElementById('btnExportPNG').addEventListener('click', () => {
        const currentSel = state.selectedId;
        state.selectedId = null;
        renderCanvas();

        html2canvas(artboard, { scale: 2 }).then(canvas => {
          const link = document.createElement('a');
          link.download = 'mimi-designer.png';
          link.href = canvas.toDataURL('image/png');
          link.click();

          state.selectedId = currentSel;
          renderCanvas();
        });
      });

      // Initialize
      initColorGrid();
      lucide.createIcons();
    });
  </script>
</body>
</html>
