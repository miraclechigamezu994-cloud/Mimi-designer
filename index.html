<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mimi Designer - Mobile Logo & Graphics Studio</title>
    <style>
        :root {
            --bg-dark: #12141c;
            --bg-card: #1e2230;
            --bg-hover: #2a2f42;
            --accent: #ff2a6d;
            --accent-glow: rgba(255, 42, 109, 0.4);
            --text-main: #f0f2f8;
            --text-muted: #8c96b0;
            --border-color: #2e344a;
            --dock-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            height: 54px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 100;
        }

        .brand-title {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            background: linear-gradient(45deg, #ff2a6d, #05d9e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff2a6d, #d1004b);
            color: white;
            border: none;
            padding: 0 16px;
            height: 38px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px var(--accent-glow);
            cursor: pointer;
        }

        /* Main Workspace Container */
        .workspace {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #0a0b10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            /* Checkerboard pattern for transparency background */
            background-image: 
                linear-gradient(45deg, #161925 25%, transparent 25%), 
                linear-gradient(-45deg, #161925 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #161925 75%),
                linear-gradient(-45deg, transparent 75%, #161925 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* The Big White Artboard */
        .artboard-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
            transition: width 0.2s, height 0.2s;
        }

        #artboard {
            width: 1000px;
            height: 1000px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            transform-origin: center center;
        }

        /* Canvas Element Wrapper */
        .canvas-element {
            position: absolute;
            cursor: move;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            box-sizing: border-box;
        }

        .canvas-element.selected {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Element Selection Handles */
        .handle {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: none;
        }

        .canvas-element.selected .handle {
            display: block;
        }

        .handle-se { bottom: -7px; right: -7px; cursor: se-resize; }
        .handle-nw { top: -7px; left: -7px; cursor: nw-resize; }
        .handle-rot { top: -24px; left: calc(50% - 7px); cursor: grab; background: var(--accent); }

        /* Bottom Floating Dock */
        .bottom-dock {
            height: var(--dock-height);
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            z-index: 100;
        }

        .dock-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            width: 60px;
        }

        .dock-item.active, .dock-item:active {
            color: var(--accent);
        }

        .dock-icon {
            font-size: 1.3rem;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-hover);
        }

        .dock-item.active .dock-icon {
            background: rgba(255, 42, 109, 0.15);
            color: var(--accent);
        }

        /* Slide-up Control Panels */
        .control-panel {
            position: fixed;
            bottom: var(--dock-height);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            border-radius: 16px 16px 0 0;
            padding: 16px;
            max-height: 50vh;
            overflow-y: auto;
            transform: translateY(110%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 90;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
        }

        .control-panel.open {
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
        }

        .close-panel {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Grid Controls Inside Panels */
        .grid-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .opt-card {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.8rem;
            text-align: center;
        }

        .opt-card svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Color Swatches Grid */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }

        /* Text Input Group */
        .text-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .text-input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .text-input:focus {
            border-color: var(--accent);
        }

        .hidden-file-input {
            display: none;
        }

        /* Layer List Item */
        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-hover);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="top-bar">
        <div class="brand-title">Mimi Designer</div>
        <div class="top-actions">
            <button class="btn-icon" id="btn-undo" title="Undo">↩</button>
            <button class="btn-icon" id="btn-clear" title="Clear Canvas">🗑️</button>
            <button class="btn-primary" id="btn-export">Export 📥</button>
        </div>
    </header>

    <!-- Main Workspace with White Artboard -->
    <main class="workspace" id="workspace">
        <div class="artboard-container">
            <div id="artboard"></div>
        </div>
    </main>

    <!-- Slide-up Panel: Text -->
    <div class="control-panel" id="panel-text">
        <div class="panel-header">
            <span class="panel-title">Add & Edit Text</span>
            <button class="close-panel">✕</button>
        </div>
        <div class="text-input-group">
            <input type="text" id="text-entry" class="text-input" placeholder="Type text here...">
            <button class="btn-primary" id="btn-add-text">Add</button>
        </div>
        <div class="grid-options">
            <div class="opt-card" data-font="Arial">Sans</div>
            <div class="opt-card" data-font="Georgia" style="font-family: Georgia;">Serif</div>
            <div class="opt-card" data-font="Courier New" style="font-family: 'Courier New';">Mono</div>
            <div class="opt-card" data-font="Trebuchet MS" style="font-family: 'Trebuchet MS';">Modern</div>
        </div>
    </div>

    <!-- Slide-up Panel: Colors -->
    <div class="control-panel" id="panel-colors">
        <div class="panel-header">
            <span class="panel-title">Color Palette</span>
            <button class="close-panel">✕</button>
        </div>
        <div class="color-grid" id="color-palette"></div>
    </div>

    <!-- Slide-up Panel: Shapes -->
    <div class="control-panel" id="panel-shapes">
        <div class="panel-header">
            <span class="panel-title">Shapes & Lines</span>
            <button class="close-panel">✕</button>
        </div>
        <div class="grid-options" id="shapes-list"></div>
    </div>

    <!-- Slide-up Panel: Icons & Logos -->
    <div class="control-panel" id="panel-logos">
        <div class="panel-header">
            <span class="panel-title">Logos & Social Icons</span>
            <button class="close-panel">✕</button>
        </div>
        <div class="grid-options" id="logos-list"></div>
    </div>

    <!-- Slide-up Panel: Photos & Uploads -->
    <div class="control-panel" id="panel-photo">
        <div class="panel-header">
            <span class="panel-title">Add Photo</span>
            <button class="close-panel">✕</button>
        </div>
        <button class="btn-primary" style="width:100%; justify-content:center; padding: 14px;" onclick="document.getElementById('img-upload').click()">📷 Upload Image from Phone</button>
        <input type="file" id="img-upload" class="hidden-file-input" accept="image/*">
    </div>

    <!-- Bottom Dock Navigation -->
    <nav class="bottom-dock">
        <button class="dock-item" data-target="panel-text">
            <div class="dock-icon">T</div>
            <span>Text</span>
        </button>
        <button class="dock-item" data-target="panel-colors">
            <div class="dock-icon">🎨</div>
            <span>Color</span>
        </button>
        <button class="dock-item" data-target="panel-shapes">
            <div class="dock-icon">⬛</div>
            <span>Shapes</span>
        </button>
        <button class="dock-item" data-target="panel-logos">
            <div class="dock-icon">⚡</div>
            <span>Logos</span>
        </button>
        <button class="dock-item" data-target="panel-photo">
            <div class="dock-icon">🖼️</div>
            <span>Photo</span>
        </button>
    </nav>

    <!-- HTML2Canvas Library for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const artboard = document.getElementById('artboard');
        let selectedElement = null;
        let activeColor = '#D4AF37'; // Default Metallic Gold

        // 20+ Swatches Palette
        const paletteColors = [
            '#D4AF37', '#B76E79', '#FF2A6D', '#05D9E8', '#00FF66', '#FF9900',
            '#9B51E0', '#2D9CDB', '#EB5757', '#F2C94C', '#2196F3', '#E91E63',
            '#000000', '#333333', '#888888', '#FFFFFF', '#1A237E', '#004D40'
        ];

        // Populate Colors Grid
        const colorPaletteContainer = document.getElementById('color-palette');
        paletteColors.forEach(color => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = color;
            swatch.onclick = () => {
                activeColor = color;
                if (selectedElement) {
                    if (selectedElement.dataset.type === 'text') {
                        selectedElement.style.color = color;
                    } else if (selectedElement.dataset.type === 'shape') {
                        const svg = selectedElement.querySelector('svg');
                        if (svg) svg.setAttribute('fill', color);
                    }
                }
            };
            colorPaletteContainer.appendChild(swatch);
        });

        // Dock Panel Toggling
        document.querySelectorAll('.dock-item').forEach(btn => {
            btn.onclick = () => {
                const targetPanel = document.getElementById(btn.dataset.target);
                const isOpen = targetPanel.classList.contains('open');
                document.querySelectorAll('.control-panel').forEach(p => p.classList.remove('open'));
                document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active'));
                
                if (!isOpen) {
                    targetPanel.classList.add('open');
                    btn.classList.add('active');
                }
            };
        });

        document.querySelectorAll('.close-panel').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.control-panel').forEach(p => p.classList.remove('open'));
                document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active'));
            };
        });

        // Add Text Logic
        document.getElementById('btn-add-text').onclick = () => {
            const val = document.getElementById('text-entry').value || 'Mimi Designer';
            const el = createCanvasElement('text');
            el.innerText = val;
            el.style.fontSize = '36px';
            el.style.color = activeColor;
            el.style.fontWeight = 'bold';
            artboard.appendChild(el);
            selectElement(el);
        };

        // Create Generic Base Element
        function createCanvasElement(type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'canvas-element';
            wrapper.dataset.type = type;
            wrapper.style.left = '350px';
            wrapper.style.top = '350px';

            // Resize and Rotate Handles
            const handleSE = document.createElement('div');
            handleSE.className = 'handle handle-se';
            const handleRot = document.createElement('div');
            handleRot.className = 'handle handle-rot';

            wrapper.appendChild(handleSE);
            wrapper.appendChild(handleRot);

            makeDraggable(wrapper);
            wrapper.onclick = (e) => {
                e.stopPropagation();
                selectElement(wrapper);
            };

            return wrapper;
        }

        function selectElement(el) {
            document.querySelectorAll('.canvas-element').forEach(e => e.classList.remove('selected'));
            selectedElement = el;
            if (el) el.classList.add('selected');
        }

        artboard.onclick = () => selectElement(null);

        // Touch and Mouse Dragging
        function makeDraggable(el) {
            let isDragging = false, startX, startY, initialLeft, initialTop;

            const onStart = (e) => {
                isDragging = true;
                const point = e.touches ? e.touches[0] : e;
                startX = point.clientX;
                startY = point.clientY;
                initialLeft = parseInt(el.style.left) || 0;
                initialTop = parseInt(el.style.top) || 0;
            };

            const onMove = (e) => {
                if (!isDragging) return;
                const point = e.touches ? e.touches[0] : e;
                const dx = point.clientX - startX;
                const dy = point.clientY - startY;
                el.style.left = (initialLeft + dx) + 'px';
                el.style.top = (initialTop + dy) + 'px';
            };

            const onEnd = () => { isDragging = false; };

            el.addEventListener('mousedown', onStart);
            el.addEventListener('touchstart', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('touchmove', onMove);
            window.addEventListener('mouseup', onEnd);
            window.addEventListener('touchend', onEnd);
        }

        // Image Upload Logic
        document.getElementById('img-upload').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const el = createCanvasElement('image');
                    const img = document.createElement('img');
                    img.src = event.target.result;
                    img.style.maxWidth = '250px';
                    img.style.pointerEvents = 'none';
                    el.appendChild(img);
                    artboard.appendChild(el);
                    selectElement(el);
                };
                reader.readAsDataURL(file);
            }
        };

        // Export Canvas to PNG Image
        document.getElementById('btn-export').onclick = () => {
            selectElement(null);
            html2canvas(artboard).then(canvas => {
                const link = document.createElement('a');
                link.download = 'mimi-design.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        };

        // Clear Canvas
        document.getElementById('btn-clear').onclick = () => {
            if (confirm("Clear all items from artboard?")) {
                artboard.innerHTML = '';
            }
        };
    </script>
</body>
</html>
